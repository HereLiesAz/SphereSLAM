# SphereSLAM standalone version catalog.
# Policy: every version is pinned exactly (no ranges or dynamic versions), normally to the latest
# stable release when last updated; deliberate exceptions are commented where they are declared.
[versions]
agp = "9.4.1"
coreKtx = "1.19.1"
# :testapp only (the on-device test bench; not published).
camerax = "1.6.1"
activity = "1.13.0"
onnxruntime = "1.30.0"
# Exception: LiteRT stays on the 1.x classic Interpreter + GPU delegate line, because litert 2.x
# removes org.tensorflow.lite.Delegate (an API break for DepthRuntime's GPU delegate). Do not mix
# with litert 2.x in the same app.
litert = "1.4.2"
opencv = "5.0.0.1"
junit = "4.13.2"
# :testapp layout tests (renders the screen on the JVM with system-bar insets).
robolectric = "4.17"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
ndk = "30.0.16248370"
cmake = "4.4.4"
jdk = "21"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
# OpenCV from Maven Central (Java + native libopencv_java5.so); used by :reloc only.
opencv = { group = "org.opencv", name = "opencv", version.ref = "opencv" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
litert-gpu = { group = "com.google.ai.edge.litert", name = "litert-gpu", version.ref = "litert" }
litert-gpu-api = { group = "com.google.ai.edge.litert", name = "litert-gpu-api", version.ref = "litert" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
